<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Отправить на рамку</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#101824;color:#f5f7fb;margin:0;padding:24px}main{max-width:520px;margin:auto}h1{font-size:26px}p{line-height:1.5;color:#cbd5e1}label,.btn{display:block;background:#27374a;border:1px solid #53657a;border-radius:13px;padding:15px;text-align:center;margin:15px 0;font-size:17px}input{display:none}button{color:white;cursor:pointer}.btn{width:100%;background:#217c69;border:0}.btn:disabled{opacity:.5}#preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}#status{white-space:pre-wrap;color:#9be6d0}small{color:#9aaec2}</style></head><body><main><h1>Фото на рамку</h1><p>Выбери только те фотографии, которые хочешь показать на московском iPad. Оригиналы на iPhone останутся без изменений.</p><label for="files">Выбрать фотографии</label><input id="files" type="file" accept="image/*" multiple><div id="preview"></div><p id="summary">Фотографии пока не выбраны</p><button id="send" class="btn" disabled>Отправить на рамку</button><p id="status"></p><small>Семейные фотографии не передаются на GitHub. Отправка станет доступна после подключения защищённого облачного доступа.</small></main><script>
'use strict';
const input=document.getElementById('files'),preview=document.getElementById('preview'),summary=document.getElementById('summary'),send=document.getElementById('send'),status=document.getElementById('status');let prepared=[];
async function shrink(file){const bitmap=await createImageBitmap(file);const max=1600,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Ошибка сжатия')),'image/jpeg',.82))}
input.addEventListener('change',async()=>{send.disabled=true;status.textContent='';prepared=[];preview.replaceChildren();const files=Array.from(input.files||[]);if(!files.length)return;summary.textContent='Подготавливаем '+files.length+' фото…';for(const file of files){try{const blob=await shrink(file);prepared.push({blob,name:file.name});const img=document.createElement('img');img.src=URL.createObjectURL(blob);img.onload=()=>URL.revokeObjectURL(img.src);preview.append(img)}catch(e){status.textContent+='Не удалось обработать '+file.name+'\n'}}const kb=prepared.reduce((s,x)=>s+x.blob.size,0)/1024;summary.textContent=prepared.length+' фото · '+(kb/1024).toFixed(1)+' МБ после сжатия';send.disabled=prepared.length===0});
send.addEventListener('click',()=>{status.textContent='Подготовка готова. Защищённая отправка пока не подключена; фотографии никуда не отправлены.'});
</script></body></html>
