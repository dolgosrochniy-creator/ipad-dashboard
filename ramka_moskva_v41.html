(function(){'use strict';
var night=document.getElementById('night'),menu=document.getElementById('menu'),clock=document.getElementById('clock'),day=document.getElementById('day');var manual=null,until=0,hold=null;document.getElementById('testModeButton').onclick=function(){menu.classList.add('show')};
function fmt(tz,options){return new Intl.DateTimeFormat('ru-RU',Object.assign({timeZone:tz},options)).format(new Date())}
function update(){var h=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',hour:'2-digit',hour12:false}).format(new Date()));if(manual&&Date.now()>=until)manual=null;var mode=manual||(h>=23||h<1?'night':h>=1&&h<6?'deep':h<11?'morning':h<17?'day':'evening');night.classList.toggle('active',mode==='night'||mode==='deep');night.classList.toggle('deep',mode==='deep');try{var d=day.contentDocument,el=d&&d.getElementById('screen');if(el){day.contentWindow.ramkaOverride=(mode==='night'||mode==='deep')?null:mode;if(mode!=='night'&&mode!=='deep')el.className=mode;var bottom=d.querySelector('.bottom');if(bottom)bottom.style.display='none'}}catch(e){}clock.textContent=fmt('Europe/Moscow',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('date').textContent=fmt('Europe/Moscow',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('beijing').textContent=fmt('Asia/Shanghai',{hour:'2-digit',minute:'2-digit',hour12:false})}
function start(){clearTimeout(hold);hold=setTimeout(function(){menu.classList.add('show')},2000)}function stop(){clearTimeout(hold)}
clock.addEventListener('touchstart',start,{passive:true});clock.addEventListener('touchend',stop);clock.addEventListener('touchcancel',stop);clock.addEventListener('mousedown',start);document.addEventListener('mouseup',stop);clock.addEventListener('contextmenu',function(e){e.preventDefault()});
menu.querySelectorAll('[data-mode]').forEach(function(b){b.addEventListener('click',function(){manual=b.getAttribute('data-mode');until=Date.now()+300000;menu.classList.remove('show');update()})});document.getElementById('close').onclick=function(){menu.classList.remove('show')};
function weather(){var x=new XMLHttpRequest();x.timeout=10000;x.onreadystatechange=function(){if(x.readyState!==4||x.status!==200)return;try{var d=JSON.parse(x.responseText),c=d.current||{},t=c.temperature_2m,w=c.weather_code;document.getElementById('temp').textContent=typeof t==='number'?Math.round(t)+'°':'—°';setFresh(Date.now());document.getElementById('icon').textContent=w===0?'☀':w<=3?'⛅':w<=48?'☁':w<=67?'🌧':w<=77?'❄':'🌦'}catch(e){}};x.open('GET','weather_events.json?v='+Date.now(),true);x.send()}
function setFresh(at){try{localStorage.setItem('ramka_v41_lastFresh',String(at))}catch(e){}fresh()}function fresh(){var at=0;try{at=Number(localStorage.getItem('ramka_v41_lastFresh'))||0}catch(e){}var age=Date.now()-at;var offline=!navigator.onLine;var dot=document.getElementById('freshDot');dot.className=offline||!at||age>7200000?'bad':age>1800000?'warn':'good';document.getElementById('freshInfo').textContent=(offline?'Нет соединения. Показаны последние сохранённые данные.':!at?'Ожидаем первого успешного обновления данных.':age>1800000?'Данные могут быть устаревшими.':'Последнее обновление данных получено.')+(at?' Обновлено: '+new Date(at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'')+' · Часы работают без интернета.'}
document.getElementById('freshDot').onclick=function(){document.getElementById('freshInfo').classList.toggle('show');fresh()};
window.addEventListener('online',fresh);window.addEventListener('offline',fresh);
if('serviceWorker' in navigator){navigator.serviceWorker.register('ramka_sw_v41.js').then(function(){}).catch(function(){});navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.type==='ramka-fresh')setFresh(e.data.at)})}
update();weather();fresh();setInterval(update,1000);setInterval(weather,900000);setInterval(fresh,60000);
day.addEventListener('load',function(){try{var b=day.contentDocument.querySelector('.bottom');if(b)b.style.display='none';day.contentWindow.ramkaOverride=manual}catch(e){}});window.addEventListener('message',function(e){if(e.origin!==location.origin)return;if(e.data==='ramka-menu')menu.classList.add('show')});
})();
</script></body></html>
