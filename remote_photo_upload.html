<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отправить фото на московскую рамку</title><style>body{font-family:-apple-system,Arial,sans-serif;background:#101827;color:#f7fafc;max-width:650px;margin:0 auto;padding:28px 18px}h1{font-size:25px}p{line-height:1.5;color:#cbd5e1}input,button{font:inherit;border-radius:12px;padding:13px;box-sizing:border-box}input[type=email]{width:100%;border:1px solid #64748b;background:#fff;color:#111}button{border:0;background:#3b82f6;color:#fff;margin:10px 0;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;color:#fbbf24}#gallery{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}#gallery img{width:90px;height:90px;object-fit:cover;border-radius:9px}#file{width:100%;margin-top:12px}</style></head><body><h1>Фото для московской рамки</h1><p>Выбирай только те фотографии, которые хочешь добавить. Отправка происходит только после нажатия кнопки. Хранилище закрыто.</p><section id="login"><p>Войди по электронной почте. Supabase пришлёт одноразовую ссылку для входа.</p><input id="email" type="email" autocomplete="email" placeholder="Твой email"><button id="send">Получить ссылку для входа</button></section><section id="upload" hidden><p id="who"></p><input id="file" type="file" accept="image/*" multiple><div id="gallery"></div><button id="go">Отправить выбранные фото</button><button id="logout" style="background:#475569">Выйти</button></section><p id="status"></p><section id="received" hidden><h2>Проверка получения из закрытого хранилища</h2><button id="check">Проверить получение фотографий</button><p id="readstatus"></p><div id="receivedgallery" style="display:flex;flex-wrap:wrap;gap:8px"></div></section><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://huxnfwmxfrsvgxurgpkn.supabase.co','sb_publishable_iCh1OvLTSrTzp1xbj7jSUg_2-lSut_w',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;
async function refresh(){const {data:{user}}=await sb.auth.getUser();$('login').hidden=!!user;$('upload').hidden=!user;$('received').hidden=!user;$('who').textContent=user?'Вход выполнен: '+user.email:'';}
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return status('Введи email');const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0].split('?')[0]}});status(error?'Ошибка: '+error.message:'Проверь почту и открой ссылку на этом iPhone.')};
$('logout').onclick=async()=>{await sb.auth.signOut();await refresh()};
$('file').onchange=()=>{const gallery=$('gallery');gallery.replaceChildren();for(const file of $('file').files){if(!file.type.startsWith('image/'))continue;const img=document.createElement('img');img.src=URL.createObjectURL(file);img.onload=()=>URL.revokeObjectURL(img.src);gallery.append(img)}};
$('go').onclick=async()=>{const files=Array.from($('file').files).filter(f=>f.type.startsWith('image/'));if(!files.length)return status('Сначала выбери фотографии');$('go').disabled=true;let ok=0;for(const f of files){status('Отправлено '+ok+' из '+files.length);const ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase();const path=crypto.randomUUID()+'.'+ext;const {error}=await sb.storage.from('frame-photos').upload(path,f,{contentType:f.type,upsert:false});if(error){status('Ошибка загрузки '+f.name+': '+error.message+'\nОтправлено: '+ok);$('go').disabled=false;return}ok++}status('Успешно отправлено '+ok+' фото.');$('file').value='';$('gallery').replaceChildren();$('go').disabled=false};
$('check').onclick=async()=>{const out=$('receivedgallery');out.replaceChildren();$('readstatus').textContent='Проверяем доступ…';const {data,error}=await sb.storage.from('frame-photos').list('',{limit:20,sortBy:{column:'created_at',order:'desc'}});if(error){$('readstatus').textContent='Ошибка списка: '+error.message;return}const items=(data||[]).filter(x=>x.name&&!x.name.startsWith('.'));if(!items.length){$('readstatus').textContent='Хранилище доступно, но фотографий не найдено';return}let ok=0;for(const f of items.slice(0,8)){const {data:blob,error:e}=await sb.storage.from('frame-photos').download(f.name);if(e)continue;const img=document.createElement('img');img.src=URL.createObjectURL(blob);img.style.cssText='width:110px;height:110px;object-fit:cover;border-radius:8px';img.onload=()=>URL.revokeObjectURL(img.src);out.append(img);ok++}$('readstatus').textContent='В закрытом хранилище найдено '+items.length+' фото. Успешно прочитано '+ok+'.';};
sb.auth.onAuthStateChange(()=>refresh());refresh();
</script></body></html>
