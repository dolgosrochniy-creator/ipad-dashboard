<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест синхронизации рамки</title><style>body{font:17px -apple-system,Arial;background:#101827;color:white;padding:22px;line-height:1.5}button{padding:15px;border:0;border-radius:12px;background:#3b82f6;color:white;font:inherit}pre{white-space:pre-wrap}a{color:#93c5fd}</style></head><body><h2>Проверка синхронизации фотографий</h2><p>Тест использует закрытый Supabase и ту же локальную базу IndexedDB, что и фоторамка, но не меняет основной экран.</p><button id="run">Проверить и добавить новые фото</button><pre id="status">Ожидание</pre><p>Если появится login-required, сначала войди на <a href="remote_photo_upload.html">странице отправки фотографий</a> в этом же Safari.</p><script type="module">import {syncFramePhotos} from './remote_frame_sync.js';document.getElementById('run').onclick=async()=>{document.getElementById('status').textContent='Проверка…';const result=await syncFramePhotos();document.getElementById('status').textContent=JSON.stringify(result,null,2)}</script></body></html>
