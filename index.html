<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рамка — Москва / Пекин</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0c1422;color:#f5f7fa;transition:background 1.5s,color 1.5s}
.wrap{padding:4vh 4vw;max-width:1400px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kicker{letter-spacing:.19em;font-size:clamp(11px,1.6vw,16px);opacity:.65;text-transform:uppercase}
h1{font-size:clamp(22px,3vw,38px);margin:8px 0;font-weight:600}
.pill{font-size:clamp(12px,1.7vw,18px);padding:9px 15px;border:1px solid #405066;border-radius:40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:4vh}
.panel{border:1px solid #33465e;background:rgba(255,255,255,.045);border-radius:24px;padding:3vw;min-width:0}
.city{font-size:clamp(18px,2.6vw,32px);font-weight:600}
.time{font-size:clamp(52px,9vw,120px);font-weight:250;letter-spacing:-.055em;line-height:1.22;font-variant-numeric:tabular-nums}
.sec{font-size:.38em;letter-spacing:0;opacity:.5;margin-left:.18em}
.date{font-size:clamp(14px,2vw,24px);opacity:.72}
.weather{margin-top:2vh;font-size:clamp(14px,1.8vw,22px);opacity:.88;min-height:1.5em}
.bottom{margin-top:3vh;display:flex;justify-content:space-between;gap:20px;font-size:clamp(12px,1.6vw,18px);opacity:.65}
body.morning{background:linear-gradient(130deg,#263c4e,#554b47);color:#fff7ec}
body.day{background:linear-gradient(130deg,#0b1a2b,#162b3c)}
body.evening{background:linear-gradient(130deg,#1b2033,#3c2d35)}
body.night{background:#030303;color:#797979}
body.night .panel{border-color:#181818;background:#070707}
body.night .pill,body.night .weather,body.night .bottom{opacity:.35}
@media(max-width:600px){.wrap{padding:5vh 4vw}.grid{gap:10px}.panel{padding:16px;border-radius:16px}.time{font-size:clamp(34px,8vw,68px)}.sec{display:none}}
</style></head><body class="day">
<div class="wrap">
<div class="top"><div><div class="kicker">Личная информационная рамка</div><h1>Москва · Пекин</h1></div><div class="pill" id="mode">День</div></div>
<div class="grid">
<section class="panel"><div class="city">Москва</div><div class="time" id="msk">--:--</div><div class="date" id="mskdate">—</div><div class="weather" id="mskw">Погода загружается…</div></section>
<section class="panel"><div class="city">Пекин</div><div class="time" id="pek">--:--</div><div class="date" id="pekdate">—</div><div class="weather" id="pekw">Погода загружается…</div></section>
</div>
<div class="bottom"><span id="message">Режимы переключаются автоматически по московскому времени</span><span id="updated">Версия 1.0</span></div>
</div>
<script>
const $=id=>document.getElementById(id);
const zones=[['Europe/Moscow','msk'],['Asia/Shanghai','pek']];
const fmt=(tz,options)=>new Intl.DateTimeFormat('ru-RU',{timeZone:tz,...options}).format(new Date());
function tick(){
 for(const [tz,id] of zones){
  const t=fmt(tz,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).split(':');
  $(id).innerHTML=t[0]+':'+t[1]+'<span class="sec">'+t[2]+'</span>';
  $(id+'date').textContent=fmt(tz,{weekday:'long',day:'numeric',month:'long'});
 }
 const hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',hour:'2-digit',hour12:false}).format(new Date()));
 const mode=hour>=6&&hour<10?'morning':hour>=10&&hour<18?'day':hour>=18&&hour<23?'evening':'night';
 const labels={morning:'Утро',day:'День',evening:'Вечер',night:'Ночь'};
 document.body.className=mode;$('mode').textContent=labels[mode];
}
tick();setInterval(tick,1000);
function description(code){if(code===0)return'Ясно';if(code<=3)return'Переменная облачность';if(code<=48)return'Туман';if(code<=67)return'Дождь';if(code<=77)return'Снег';if(code<=82)return'Ливни';if(code<=86)return'Снегопад';if(code>=95)return'Гроза';return'Облачно'}
async function weather(id,lat,lon){
 try{
 const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,weather_code&timezone=auto';
 const response=await fetch(url);if(!response.ok)throw Error();
 const d=(await response.json()).current;
 $(id).textContent=description(d.weather_code)+' · '+Math.round(d.temperature_2m)+'°C · влажность '+d.relative_humidity_2m+'%';
 $('updated').textContent='Погода обновлена '+fmt('Europe/Moscow',{hour:'2-digit',minute:'2-digit'});
 }catch(e){$(id).textContent='Погода недоступна · требуется интернет'}
}
function updateWeather(){weather('mskw',55.7558,37.6173);weather('pekw',39.9042,116.4074)}
updateWeather();setInterval(updateWeather,30*60*1000);
</script></body></html>
