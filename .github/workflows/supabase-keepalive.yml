name: Keep Supabase project active
on:
  schedule:
    - cron: '17 2,10,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Supabase Auth health
        env:
          SUPABASE_URL: https://huxnfwmxfrsvgxurgpkn.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_iCh1OvLTSrTzp1xbj7jSUg_2-lSut_w
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 25 --retry 2 --retry-delay 5 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/auth/v1/health")
          echo "Supabase Auth health HTTP status: $code"
          test "$code" = "200"
