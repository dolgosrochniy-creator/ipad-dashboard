name: Keep Supabase project active
on:
  schedule:
    - cron: '17 2,10,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Update Supabase heartbeat record
        env:
          SUPABASE_URL: https://huxnfwmxfrsvgxurgpkn.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_iCh1OvLTSrTzp1xbj7jSUg_2-lSut_w
        run: |
          set -euo pipefail
          response=$(mktemp)
          code=$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' --max-time 25 --retry 2 --retry-delay 5 \
            -X POST \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/frame_keepalive_ping")
          echo "Supabase heartbeat HTTP status: $code"
          if [ "$code" != "200" ]; then
            cat "$response"
            exit 1
          fi
          echo "Heartbeat database update succeeded."
