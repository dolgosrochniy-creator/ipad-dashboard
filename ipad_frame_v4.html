function clock(tz){return new Intl.DateTimeFormat('ru-RU',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());}
function update(){var now=new Date();var msk=clock('Europe/Moscow');var pek=clock('Asia/Shanghai');document.getElementById('msk').textContent=msk;document.getElementById('pek').textContent=pek;document.getElementById('date').textContent=new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',weekday:'long',day:'numeric',month:'long'}).format(now);var hour=parseInt(msk.split(':')[0],10);var mode=hour>=6&&hour<10?'morning':hour>=10&&hour<18?'day':hour>=18&&hour<23?'evening':'night';if(document.body.className!==mode){document.body.className=mode;var p=mode==='morning'?pictures[0]:mode==='day'?pictures[1]:pictures[2];document.getElementById('background').style.backgroundImage='url("'+p+'")';}}update();setInterval(update,10000);
